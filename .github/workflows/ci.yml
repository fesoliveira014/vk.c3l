name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vk.c3l
      - name: install c3c 0.8.5_1
        run: |
          curl -L -o c3c.tar.gz https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz
          tar xf c3c.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"
      - name: loader entry points match the commands
        working-directory: vk.c3l
        run: python3 scripts/generate_loader.py --check
      - name: install the Vulkan loader (run time only; nothing links it)
        run: sudo apt-get update -q && sudo apt-get install -y libvulkan1
      - name: binding tests
        working-directory: vk.c3l
        run: c3c test unit --path test
      - name: smoke compile
        run: |
          mkdir smoke && cd smoke
          cat > project.json <<'JSON'
          {
            "langrev": "1",
            "dependency-search-paths": [ ".." ],
            "dependencies": [ "vk" ],
            "sources": [ "main.c3" ],
            "targets": { "smoke": { "type": "executable" } }
          }
          JSON
          cat > main.c3 <<'C3'
          module smoke;
          import vk;
          fn void main()
          {
              vk::ApplicationInfo info;
              info.api_version = 0;
          }
          C3
          c3c build smoke
          ! objdump -p build/smoke | grep -F libvulkan
